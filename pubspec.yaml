name: document_scanner
description: "A document scanner and PDF creator app."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_doc_scanner: ^0.0.21
  path_provider: ^2.1.6
  pdf: ^3.13.1
  image: ^4.10.1
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  upgrader: ^13.5.0
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  google_mobile_ads:
    path: third_party/google_mobile_ads
  google_mlkit_text_recognition: ^0.17.1
  app_tracking_transparency: ^2.0.7
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/document_scanner_app_icon.png"
  remove_alpha_ios: true